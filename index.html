/* ===== 探索揭示 ===== */
function revealRay(cx,cy,ang,len){ // 射线扫描：撞楼即回波停止
 const s=Math.sin(ang),c=Math.cos(ang);
 for(let d=0;d<len;d+=.45){
  const x=Math.round(cx+s*d),y=Math.round(cy+c*d);
  if(!inMap(x,y))break;
  const i=idx(x,y);
  if(explored[i]<1){explored[i]=Math.min(1,explored[i]+.16);markDirty(x,y);}
  if(cellT[i]===T_BLD)break;      // 墙体回波，射线终止
 }
}
function revealNear(cx,cy,r,rate){ // 车周近场渐亮
 for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){
  if(!inMap(x,y))continue;
  const d=Math.hypot(x-cx,y-cy);if(d>r)continue;
  const i=idx(x,y);const v=explored[i];
  if(v<1){explored[i]=Math.min(1,v+rate*(1-d/r));markDirty(x,y);}
 }
}
function countExplored(){let n=0;for(let i=0;i<COLS*ROWS;i++)if(explored[i]>.25)n++;return n/(COLS*ROWS);}

/* ===== Dijkstra（第二幕）：goal 波纹扩散 + 回溯高亮 ===== */
const INF=1e9;
let DIST=null,PRE=null,PATH=[],order=[],orderIdx=0;
function dijkstra(){
 const n=COLS*ROWS;DIST=new Float64Array(n).fill(INF);PRE=new Int32Array(n).fill(-1);
 const cost=i=>{const t=cellT[i];if(t===T_BLD)return INF;if(t===T_WATER)return INF;
  return (t===T_ROAD||t===T_XING||t===T_PLAZA)?1:2.4;};
 const gi=idx(GOAL[0],GOAL[1]);DIST[gi]=0;
 const pq=[[0,gi]];                 // 小图直接数组堆
 while(pq.length){
  let bi=0;for(let k=1;k<pq.length;k++)if(pq[k][0]<pq[bi][0])bi=k;
  const [d,u]=pq.splice(bi,1)[0];
  if(d>DIST[u])continue;
  const ux=u%COLS,uy=(u/COLS)|0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const vx=ux+dx,vy=uy+dy;if(!inMap(vx,vy))continue;
   const v=idx(vx,vy),nc=d+cost(v);
   if(nc<DIST[v]){DIST[v]=nc;PRE[v]=u;pq.push([nc,v]);}

 }
 order=[];for(let i=0;i<n;i++)if(DIST[i]<INF)order.push(i);
 order.sort((a,b)=>DIST[a]-DIST[b]);
 PATH=[];let cur=idx(START[0],START[1]);
 if(DIST[cur]>=INF)return;

function routeLen(){let L=0;for(let k=1;k<ROUTE.length;k++)L+=Math.hypot(ROUTE[k][0]-ROUTE[k-1][0],ROUTE[k][1]-ROUTE[k-1][1]);return L;}
function routePos(prog){ // prog: 0..1 → [x,y,heading 四向量化]
 const segs=[];let L=0;
 for(let k=1;k<ROUTE.length;k++){const d=Math.hypot(ROUTE[k][0]-ROUTE[k-1][0],ROUTE[k][1]-ROUTE[k-1][1]);segs.push(d);L+=d;}
 let target=prog*L;
 for(let k=0;k<segs.length;k++){
  if(target<=segs[k]){
   const f=target/segs[k],a=ROUTE[k],b=ROUTE[k+1];
   const ang=Math.atan2(b[0]-a[0],b[1]-a[1]);
   const q=Math.round(ang/(Math.PI/2))*(Math.PI/2);   // 方向摆正：四向
   return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,q];
  }
  target-=segs[k];
 }
 const a=ROUTE[ROUTE.length-2],b=ROUTE[ROUTE.length-1];
 const ang=Math.atan2(b[0]-a[0],b[1]-a[1]);

const SCENES=[
 {atGrid:[13,16], name:'生活区 · 第一餐厅',       img:'canteen'},
 {atGrid:[12,28], name:'体育馆',                  img:'stadium'},
 {atGrid:[24,31], name:'图书馆',                  img:'library'},
 {atGrid:[21,38], name:'中轴广场 · 地标',         img:'monument'},
 {atGrid:[15,45], name:'信义楼 · 第二教学科研楼', img:'building'}];
function routeProgAt(gx,gy){
 let best=0,bd=1e9,acc=0;
 for(let k=0;k<ROUTE.length-1;k++){
  const a=ROUTE[k],b=ROUTE[k+1];
  const seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
  const t=Math.max(0,Math.min(1,((gx-a[0])*(b[0]-a[0])+(gy-a[1])*(b[1]-a[1]))/(seg*seg||1)));
  const px=a[0]+(b[0]-a[0])*t,py=a[1]+(b[1]-a[1])*t;
  const d=Math.hypot(gx-px,gy-py);
  if(d<bd){bd=d;best=acc+seg*t;}
  acc+=seg;
 }
 const L=routeLen();
 return L?Math.min(1,best/L):0;
}
SCENES.forEach(function(s){s.at=routeProgAt(s.atGrid[0],s.atGrid[1]);});
/* ===== 场景展示（探索途中行经触发，底部升起，不挡太阳） ===== */
let scShow=null,scFired=SCENES.map(()=>false);
const SC_IN=400,SC_HOLD=1800,SC_OUT=400;
function drawScene(t){
 if(!scShow)return;
 const el=t-scShow.t0;
 let a= el<SC_IN? el/SC_IN : el<SC_IN+SC_HOLD?1 : Math.max(0,1-(el-SC_IN-SC_HOLD)/SC_OUT);
 if(el>SC_IN+SC_HOLD+SC_OUT){scShow=null;return;}
 const w=Math.min(W*.62,252),h=w*SC_H/SC_W;
 const x=(W-w)/2;
 const yT=H*.80-h;
 const rise=1-Math.pow(1-Math.min(1,el/700),3);
 const y=yT+(1-rise)*(h*.4+70);
 ctx.save();ctx.globalAlpha=a;
 ctx.shadowColor='rgba(42,36,28,.4)';ctx.shadowBlur=16;ctx.shadowOffsetY=6;
 ctx.beginPath();ctx.roundRect(x-4,y-4,w+8,h+8,8);
 ctx.fillStyle='#F6EFDC';ctx.fill();
 ctx.shadowColor='transparent';
 const img=SC_IMGS[SCENES[scShow.idx].img];
 ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,5);ctx.clip();
 if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,x,y,w,h);
 else{ctx.fillStyle='#EAE0C8';ctx.fillRect(x,y,w,h);}
 ctx.restore();
 ctx.font='11px WK, KaiTi, serif';
 const nm=SCENES[scShow.idx].name;
 const tw=ctx.measureText(nm).width;
 ctx.fillStyle='rgba(58,53,44,.78)';
 ctx.beginPath();ctx.roundRect(W/2-tw/2-10,y+h+8,tw+20,20,10);ctx.fill();
 ctx.fillStyle='#F6EFDC';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(nm,W/2,y+h+18.5);
 ctx.restore();
}
function sceneCheck(t,carProg){
 if(scShow)return;
 for(let i=0;i<SCENES.length;i++){
  if(scFired[i])continue;
  if(carProg>=SCENES[i].at){scFired[i]=true;scShow={idx:i,t0:t};break;}
 }
}</script>
