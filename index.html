 transition:transform .2s}

const INF=1e9;

  const [d,u]=pq.splice(bi,1)[0];

   const vx=ux+dx,vy=uy+dy;if(!inMap(vx,vy))continue;

function routeLen(){let L=0;for(let k=1;k<ROUTE.length;k++)L+=Math.hypot(ROUTE[k][0]-ROUTE[k-1][0],ROUTE[k][1]-ROUTE[k-1][1]);return L;}

  if(target<=segs[k]){
   const f=target/segs[k],a=ROUTE[k],b=ROUTE[k+1];
   return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,Math.atan2(b[0]-a[0],b[1]-a[1])];
  }

/* 场景配置：触发 prog（两幕共用行程0-1；-1=第三幕等灯时刻专属） */
const SCENES=[
 {at:0.02, name:'生活区 · 十六号楼',      draw:drawSc1},
 {at:0.26, name:'第一餐厅 · 一餐',        draw:drawSc2},
 {at:-1,   name:'学林街 · 斑马线',        draw:drawSc3},
 {at:0.755,name:'问鼎广场 · 环岛',        draw:drawSc4},
 {at:0.93, name:'信义楼 · 第二教学科研楼',draw:drawSc5}];
const SC_W=240,SC_H=150;
const scCanvases=SCENES.map(s=>{
 const c=document.createElement('canvas');c.width=SC_W*2;c.height=SC_H*2;
 const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);
 s.draw(g,SC_W,SC_H);return c;});
/* ===== 沿路场景展示（第三幕回忆闪现） ===== */
let scShow=null,scFired=SCENES.map(()=>false);
const SC_IN=400,SC_HOLD=1800,SC_OUT=400;
function drawScene(t){ // 相框小画自底部升起（不挡右上太阳），淡入淡出
 if(!scShow)return;
 const el=t-scShow.t0;
 let a= el<SC_IN? el/SC_IN : el<SC_IN+SC_HOLD?1 : Math.max(0,1-(el-SC_IN-SC_HOLD)/SC_OUT);
 if(el>SC_IN+SC_HOLD+SC_OUT){scShow=null;return;}
 const w=Math.min(W*.62,252),h=w*SC_H/SC_W;
 const x=(W-w)/2;
 const yT=H*.80-h;                                   // 停靠位：山下、地图下方
 const rise=1-Math.pow(1-Math.min(1,el/700),3);      // 升起缓动
 const y=yT+(1-rise)*(h*.4+70);
 ctx.save();ctx.globalAlpha=a;
 ctx.shadowColor='rgba(42,36,28,.4)';ctx.shadowBlur=16;ctx.shadowOffsetY=6;
 ctx.beginPath();ctx.roundRect(x-4,y-4,w+8,h+8,8);
 ctx.fillStyle='#F6EFDC';ctx.fill();
 ctx.shadowColor='transparent';
 ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,5);ctx.clip();
 ctx.drawImage(scCanvases[scShow.idx],x,y,w,h);
 ctx.restore();
 // 节点名小条
 ctx.font='11px WK, KaiTi, serif';
 const nm=SCENES[scShow.idx].name;
 const tw=ctx.measureText(nm).width;
 ctx.fillStyle='rgba(58,53,44,.78)';
 ctx.beginPath();ctx.roundRect(W/2-tw/2-10,y+h+8,tw+20,20,10);ctx.fill();
 ctx.fillStyle='#F6EFDC';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(nm,W/2,y+h+18.5);
 ctx.restore();
}
function sceneCheck(t,carProg,lightT){ // 触发：行程比例 or 等灯时刻
 if(scShow)return;
 for(let i=0;i<SCENES.length;i++){
  if(scFired[i])continue;
  const trig=SCENES[i].at;
  if(trig===-1){ if(lightT>=0){scFired[i]=true;scShow={idx:i,t0:t};} continue; }
  if(carProg>=trig){scFired[i]=true;scShow={idx:i,t0:t};break;}
 }
}</script>
