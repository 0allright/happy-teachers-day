<script>
'use strict';
/* ===== 基础 ===== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

addEventListener('resize',resize);

const C={paper1:'#F4EDDC',paper2:'#E9DEC4',ink:'#3A352C',ink2:'#8a8272',deep:'#29241D',
 road:'#EAE0C8',grass:'#F0EAD6',bld:'#4A443A',water:'#C5D6CC',wall:'#5C5443',
 red:'#B03A2E',sun:'#C53D2B',m1:'#B5C4B0',m2:'#8FAE96',m3:'#6B947C',m4:'#4A7560'};

const COLS=46,ROWS=55;
const T_URBAN=1,T_ROAD=2,T_BLD=3,T_WATER=4,T_XING=5,T_PLAZA=6;

const idx=(x,y)=>y*COLS+x;

function fillT(x0,y0,x1,y1,t){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inMap(x,y))cellT[idx(x,y)]=t;}
function boxWall(x0,y0,x1,y1){ // 围墙：一圈墙格叠在原地形上（wall作为bld变体）
 fillT(x0,y0,x1,y0,T_BLD);fillT(x0,y1,x1,y1,T_BLD);fillT(x0,y0,x0,y1,T_BLD);fillT(x1,y0,x1,y1,T_BLD);}
function clearT(x0,y0,x1,y1){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inMap(x,y))cellT[idx(x,y)]=T_URBAN;}

fillT(3,3,42,27,T_URBAN);            // 生活区地面
boxWall(3,3,42,27);                   // 围墙

fillT(7,32,8,40,T_ROAD);              // 金沙北路（纵向）
fillT(6,41,10,42,T_PLAZA);            // 问鼎广场（环岛）
fillT(7,43,8,48,T_ROAD);              // 金沙西路（纵向）
/* 第二教学科研楼（信义楼，路东侧）：南北两翼 */

fillT(10,48,20,51,T_BLD);             // 南翼（2教南）
clearT(10,47,11,48);                  // 南北楼之间连廊
/* 月雅湖（2教东南，OSM实证） */
fillT(25,46,32,51,T_WATER);
/* 教学区氛围建筑（不标签）：中东部留白给点阵字 */
fillT(13,33,18,36,T_BLD);fillT(37,33,41,37,T_BLD);
fillT(14,39,19,42,T_BLD);fillT(33,40,38,43,T_BLD);
fillT(36,46,41,51,T_BLD);

let cell=8,ox=0,oy=0;
const dirty=new Set();
function markDirty(x,y){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inMap(x+dx,y+dy))dirty.add(idx(x+dx,y+dy));}
function layoutGrid(){

 gridCv.width=COLS*cell*DPR;gridCv.height=ROWS*cell*DPR;
 gctx.setTransform(DPR,0,0,DPR,0,0);
 for(let i=0;i<COLS*ROWS;i++)dirty.add(i);
}
function drawCell(i){
 const x=i%COLS,y=(i/COLS)|0,t=cellT[i],a=explored[i];
 const px=x*cell,py=y*cell;
 let col=C.grass;
 if(t===T_ROAD)col=C.road;else if(t===T_XING)col=C.road;
 else if(t===T_WATER)col=C.water;else if(t===T_PLAZA)col=C.road;
 else if(t===T_BLD)col=C.bld;
 gctx.globalAlpha=1;gctx.fillStyle=col;gctx.fillRect(px,py,cell+.5,cell+.5);
 if(t===T_XING&&a>.4){ // 斑马线条纹
  gctx.fillStyle='rgba(250,245,230,.75)';
  for(let k=0;k<3;k++)gctx.fillRect(px+cell*.15,py+cell*(.12+k*.32),cell*.7,cell*.16);
 }
 if(t===T_BLD&&a>.35){ // 建筑墨块细节：勾边
  gctx.strokeStyle='rgba(20,16,10,.5)';gctx.lineWidth=.5;gctx.strokeRect(px+.5,py+.5,cell-1,cell-1);}
 const cover=Math.max(0,1-a);
 if(cover>0.003){gctx.globalAlpha=cover*.96;gctx.fillStyle=C.deep;gctx.fillRect(px-.5,py-.5,cell+1,cell+1);}
}
function flushDirty(){if(!dirty.size)return;
 for(const i of dirty)drawCell(i);dirty.clear();}
/* ===== 探索揭示 ===== */
function revealRay(cx,cy,ang,len){ // 射线扫描：撞楼即回波停止
 const s=Math.sin(ang),c=Math.cos(ang);
 for(let d=0;d<len;d+=.45){
  const x=Math.round(cx+s*d),y=Math.round(cy+c*d);
  if(!inMap(x,y))break;
  const i=idx(x,y);
  if(explored[i]<1){explored[i]=Math.min(1,explored[i]+.16);markDirty(x,y);}
  if(cellT[i]===T_BLD)break;      // 墙体回波，射线终止
 }
}
function revealNear(cx,cy,r,rate){ // 车周近场渐亮
 for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){
  if(!inMap(x,y))continue;
  const d=Math.hypot(x-cx,y-cy);if(d>r)continue;
  const i=idx(x,y);const v=explored[i];
  if(v<1){explored[i]=Math.min(1,v+rate*(1-d/r));markDirty(x,y);}
 }
}
function countExplored(){let n=0;for(let i=0;i<COLS*ROWS;i++)if(explored[i]>.25)n++;return n/(COLS*ROWS);}

function drawLabels(){ // 标签随探索淡入

 for(const [x,y,txt,anch] of LBL){
  let a=0,n=0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(!inMap(x+dx,y+dy))continue;a+=explored[idx(x+dx,y+dy)];n++;}
  a=a/n;if(a<.45)continue;
  const [px,py]=gpos(x,y);

  ctx.textAlign=anch==='c'?'center':'left';

 }

/* ===== Dijkstra（第二幕）：goal 波纹扩散 + 回溯高亮 ===== */
const INF=1e9;
let DIST=null,PRE=null,PATH=[],order=[],orderIdx=0;
function dijkstra(){
 const n=COLS*ROWS;DIST=new Float64Array(n).fill(INF);PRE=new Int32Array(n).fill(-1);
 const cost=i=>{const t=cellT[i];if(t===T_BLD)return INF;if(t===T_WATER)return INF;
  return (t===T_ROAD||t===T_XING||t===T_PLAZA)?1:2.4;};
 const gi=idx(GOAL[0],GOAL[1]);DIST[gi]=0;
 const pq=[[0,gi]];                 // 小图直接数组堆
 while(pq.length){
  let bi=0;for(let k=1;k<pq.length;k++)if(pq[k][0]<pq[bi][0])bi=k;
  const [d,u]=pq.splice(bi,1)[0];
  if(d>DIST[u])continue;
  const ux=u%COLS,uy=(u/COLS)|0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const vx=ux+dx,vy=uy+dy;if(!inMap(vx,vy))continue;
   const v=idx(vx,vy),nc=d+cost(v);
   if(nc<DIST[v]){DIST[v]=nc;PRE[v]=u;pq.push([nc,v]);}
  }
 }
 order=[];for(let i=0;i<n;i++)if(DIST[i]<INF)order.push(i);
 order.sort((a,b)=>DIST[a]-DIST[b]);
 PATH=[];let cur=idx(START[0],START[1]);
 if(DIST[cur]>=INF)return;
 while(cur!==-1){PATH.push(cur);if(cur===idx(GOAL[0],GOAL[1]))break;cur=PRE[cur];}
}
function drawWave(dt){ // 扩散波前：约3.5s 扩完
 const rate=order.length/3500;           // 格/毫秒
 const end=Math.min(order.length,orderIdx+rate*dt);
 for(;orderIdx<end;orderIdx++){
  const i=order[orderIdx],x=i%COLS,y=(i/COLS)|0;
  if(explored[i]<.4)continue;
  const [px,py]=gpos(x,y);
  ctx.fillStyle='rgba(176,58,46,.55)';
  ctx.beginPath();ctx.arc(px,py,cell*.22,0,7);ctx.fill();
 }
}
function drawPath(t){ // 回溯流光
 if(PATH.length<2)return;
 ctx.save();ctx.strokeStyle='rgba(176,58,46,.9)';ctx.lineWidth=Math.max(2,cell*.3);
 ctx.lineCap='round';ctx.setLineDash([cell*1.1,cell*.7]);ctx.lineDashOffset=-t*.06;
 ctx.beginPath();
 PATH.forEach((i,k)=>{const x=i%COLS,y=(i/COLS)|0;const [px,py]=gpos(x,y);
  k?ctx.lineTo(px,py):ctx.moveTo(px,py);});
 ctx.stroke();ctx.restore();
}
/* ===== 探索轨迹上行走（第一/三幕共用） ===== */
function routeLen(){let L=0;for(let k=1;k<ROUTE.length;k++)L+=Math.hypot(ROUTE[k][0]-ROUTE[k-1][0],ROUTE[k][1]-ROUTE[k-1][1]);return L;}
function routePos(prog){ // prog: 0..1 → [x,y,heading]
 const segs=[];let L=0;
 for(let k=1;k<ROUTE.length;k++){const d=Math.hypot(ROUTE[k][0]-ROUTE[k-1][0],ROUTE[k][1]-ROUTE[k-1][1]);segs.push(d);L+=d;}
 let target=prog*L;
 for(let k=0;k<segs.length;k++){
  if(target<=segs[k]){
   const f=target/segs[k],a=ROUTE[k],b=ROUTE[k+1];
   return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,Math.atan2(b[0]-a[0],b[1]-a[1])];
  }
  target-=segs[k];
 }
 const a=ROUTE[ROUTE.length-2],b=ROUTE[ROUTE.length-1];
 return [b[0],b[1],Math.atan2(b[0]-a[0],b[1]-a[1])];
}

const statusEl=document.getElementById('status'),startBtn=document.getElementById('start');
const subEl=document.getElementById('sub'),hintEl=document.getElementById('hint');

envEl.id='env';envEl.innerHTML='<div class="flap"></div><div class="seal">腾</div><div class="tip">拆开这封信</div>';
let phase='idle',t0=0,carProg=0,laserAng=0,lastT=0,exploredPct=0,frameN=0;
let dotBorn=[],rippleT=-1,mailT=-1,lightT=-1,goalT=-1,arriveT=-1;
let pauseProg=0;{let acc=0;for(let k=0;k<ROUTE.length;k++){if(ROUTE[k][0]===12&&ROUTE[k][1]===27){pauseProg=acc/routeLen();break;}acc+=Math.hypot(ROUTE[k+1][0]-ROUTE[k][0],ROUTE[k+1][1]-ROUTE[k][1]);}}
function setStatus(s){statusEl.innerHTML=s;}
startBtn.addEventListener('click',()=>{

function finish(){ // 抵达：上楼 → 信封

let last=0;
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min(50,t-last);last=t;
 ctx.clearRect(0,0,W,H);
 ctx.drawImage(bgCv,0,0,W,H);
 if(phase==='idle'){drawIdleDecor(t);return;}
 flushDirty();
 const ga=Math.min(1,(t-t0)/800);   // 未知墨色地图首现淡入
 if(ga<1)ctx.globalAlpha=ga;
 ctx.drawImage(gridCv,ox,oy,COLS*cell,ROWS*cell);
 ctx.globalAlpha=1;
 drawLabels();
 if(phase==='act1')stepAct1(t,dt);
 else if(phase==='act2')stepAct2(t,dt);
 else if(phase==='act3')stepAct3(t,dt);
 else{ // done 静驻
  drawPath(t);drawGoal(t);drawDots(t,dotBorn);
  if(REC_MODE&&typeof drawEnvCanvas==='function')drawEnvCanvas(t);
 }
}
function drawIdleDecor(t){ // 待机：山间薄雾呼吸
 const g=ctx.createLinearGradient(0,H*.75,0,H);
 g.addColorStop(0,'rgba(244,237,220,0)');g.addColorStop(1,'rgba(74,117,96,.14)');
 ctx.fillStyle=g;ctx.fillRect(0,H*.75,W,H*.25);
}
function stepAct1(t,dt){
 const TOTAL=routeLen(),SPD=.0037; // 格/毫秒 → 全程约15秒
 carProg=Math.min(1,carProg+dt*SPD/TOTAL);
 const [x,y,h]=routePos(carProg);
 laserAng+=dt*.006;
 revealRay(x,y,laserAng,9.5);revealRay(x,y,laserAng+Math.PI*.62,7);
 revealNear(x,y,3.4,dt*.0011);
 drawLaser(x,y,laserAng);drawCar(x,y,h,'scan');
 if(++frameN%20===0){exploredPct=countExplored();
  setStatus('雷达扫描中 · 探索度 <em>'+Math.round(exploredPct*100)+'%</em>');}
 if(carProg>=1&&rippleT<0){rippleT=t;setStatus('建图完成 <em>✓</em> · 图里藏了一句话');}
 if(rippleT>=0){ // 边缘补全涟漪
  const p=Math.min(1,(t-rippleT)/2200);
  for(let i=0;i<COLS*ROWS;i++)if(explored[i]<p){explored[i]=p;dirty.add(i);}
  if(!dotBorn.length){dotBorn=DOTS.map(()=>0);}
  for(let i=0;i<dotBorn.length;i++)if(DOTS[i]&&(explored[idx(DOTS[i][0]|0,DOTS[i][1]|0)]>.5)&&dotBorn[i]===0)dotBorn[i]=1;
  for(let i=0;i<dotBorn.length;i++)if(dotBorn[i]>0&&dotBorn[i]<300)dotBorn[i]+=dt;
  drawDots(t,dotBorn.map(v=>v===1?1:v));
  if(++frameN%20===0)setStatus('地图补全 <em>'+Math.round(p*100)+'%</em>');
  if(p>=1){dotBorn=DOTS.map(()=>300);phase='act2';goalT=t;
   setStatus('goal: <em>2教南514</em> · 计算最短路径…');dijkstra();orderIdx=0;}
 }
}
function stepAct2(t,dt){
 drawWave(dt);drawPath(t);drawGoal(t);drawDots(t,dotBorn);
 if(orderIdx>=order.length){
  if(lightT===-1)lightT=t;
  if(t-lightT>2400){phase='act3';mailT=t;carProg=0;lightT=-1;scFired=SCENES.map(()=>false);scShow=null;
   setStatus('路径最优 · ≈1.2km · <em>出发送信</em>');}
 }
}
function drawLight(state){ // 信号灯：街北侧 (16,28)
 const [px,py]=gpos(16,28);
 ctx.fillStyle=C.deep;ctx.fillRect(px-1.2,py-cell*.4,2.4,cell*1.6);
 ctx.fillStyle=C.deep;ctx.beginPath();ctx.roundRect(px-cell*.5,py-cell*1.7,cell,cell*1.3,2);ctx.fill();
 if(state==='red'){ctx.fillStyle='#D8402F';ctx.beginPath();ctx.arc(px,py-cell*1.3,cell*.3,0,7);ctx.fill();}
 else{ctx.fillStyle='#4E9A5F';ctx.beginPath();ctx.arc(px,py-cell*1.3,cell*.3,0,7);ctx.fill();}
}
function stepAct3(t,dt){
 const TOTAL=routeLen(),SPD=.0055; // 全程约10秒（含等灯）
 if(carProg<pauseProg){
  carProg=Math.min(pauseProg,carProg+dt*SPD/TOTAL);
 }else if(lightT<0){
  lightT=t;setStatus('红灯 · <em>心意稍候</em>');
 }else if(t-lightT<1500){
  // 等灯
 }else{
  carProg=Math.min(1,carProg+dt*SPD/TOTAL);
  if(carProg>pauseProg+.02)setStatus('绿灯 · 送出祝福');
 }
 drawLight(lightT<0||t-lightT<1500?'red':'green');
 drawPath(t);drawGoal(t);drawDots(t,dotBorn);
 sceneCheck(t,carProg,lightT);drawScene(t);
 if(carProg<1){
  const [x,y,h]=routePos(carProg);
  drawCar(x,y,h,'mail');
 }else{
  if(arriveT<0)arriveT=t;
  const p=Math.min(1,(t-arriveT)/1400);
  const [x,y,h]=routePos(1);
  ctx.save();ctx.globalAlpha=1-p;
  drawCar(x+(GOAL[0]-x)*p*.6,y+(GOAL[1]-y)*p*.6,h,'mail');ctx.restore();
  if(p>=1)finish();
 }
}

function scTree(g,x,y,s,c1,c2,autumn){ // 行道树：干+双档树冠+光点

function scWinRow(g,x,y,w,perRow,rows,ww,wh,gapX,gapY){ // 窗户网格：两档玻璃+随机暗窗
 for(let r=0;r<rows;r++)for(let c=0;c<perRow;c++){
  const wx=x+c*(ww+gapX),wy=y+r*(wh+gapY);
  const dark=Math.sin(r*7.7+c*3.1)>0.72;
  g.fillStyle=dark?'#8FA8A6':'#B8D4D2';g.fillRect(wx,wy,ww,wh);

 }
}

 let a= el<SC_IN? el/SC_IN : el<SC_IN+SC_HOLD?1 : Math.max(0,1-(el-SC_IN-SC_HOLD)/SC_OUT);

  if(scFired[i])continue;
  const trig=SCENES[i].at;
  if(trig===-1){ if(lightT>=0){scFired[i]=true;scShow={idx:i,t0:t};} continue; }
  if(carProg>=trig){scFired[i]=true;scShow={idx:i,t0:t};break;}
 }
}</script>
